# Local dev dependencies. Host ports are overridable (POSTGRES_PORT, REDIS_PORT, S3_PORT).
# Kafka/Redpanda intentionally omitted: BullMQ on Redis for MVP.
name: shopsphere

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
      POSTGRES_DB: shopsphere
      TZ: UTC
      PGTZ: UTC
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopsphere']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes: [osdata:/usr/share/opensearch/data]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['1025:1025', '8025:8025']

  # S3-compatible object store. MinIO no longer publishes pullable community images,
  # so SeaweedFS stands in; any S3 client works against http://localhost:8333.
  # seaweedfs/s3.json: apps sign with any/any; anonymous may only read `catalog` (product and
  # review images). `invoices` is private and served through short-lived signed URLs.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json
    ports: ['${S3_PORT:-8333}:8333']
    volumes: [s3data:/data, ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro]

  # ShopSphere Bank: simulated card/netbanking/UPI gateway (Razorpay-compatible). Dev console at /dev.
  bank-sim:
    build:
      context: ..
      dockerfile: apps/bank-sim/Dockerfile
    environment:
      WEBHOOK_URL: ${BANK_WEBHOOK_URL:-http://host.docker.internal:4000/payments/webhooks/bank}
      ALLOWED_CALLBACK_ORIGINS: ${BANK_ALLOWED_CALLBACK_ORIGINS:-http://localhost:3000}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${BANK_SIM_PORT:-4100}:4100']

  courier-sim:
    build:
      context: ..
      dockerfile: apps/courier-sim/Dockerfile
    environment:
      WEBHOOK_URL: ${COURIER_WEBHOOK_URL:-http://host.docker.internal:4000/shipping/webhooks/courier-sim}
      STEP_MS: ${COURIER_STEP_MS:-30000}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${COURIER_SIM_PORT:-4500}:4500']

volumes:
  pgdata:
  osdata:
  s3data:
