name: Security

# M7.1: dependency audit (pnpm audit, prod deps, high+), secret scanning (gitleaks), and
# GitHub dependency review on PRs. Runs on every PR, on main, and weekly for new advisories.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Lockfile only: no install scripts run before the audit.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Accepted advisories live in package.json pnpm.auditConfig.ignoreGhsas
      # (each one is justified in docs/security/asvs-checklist.md).
      - run: pnpm audit --prod --audit-level high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT) directly, pinned; config + allowlist in .gitleaks.toml.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
